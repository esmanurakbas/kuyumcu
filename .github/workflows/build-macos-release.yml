name: Build macOS release

on:
  push:
    tags:
      - "macos-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: AppleSilicon
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build app
        run: bash build_mac.sh

      - name: Verify clean app bundle
        run: |
          test -d "dist/Kuyumcu Takip.app"
          ICON_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "dist/Kuyumcu Takip.app/Contents/Info.plist")
          test -n "$ICON_NAME"
          test -f "dist/Kuyumcu Takip.app/Contents/Resources/$ICON_NAME"
          if find "dist/Kuyumcu Takip.app" -name '*.db' -print -quit | grep -q .; then
            echo "Build must not contain a database"
            exit 1
          fi

      - name: Create DMG
        run: |
          mkdir dmg-root
          cp -R "dist/Kuyumcu Takip.app" dmg-root/
          hdiutil create \
            -volname "Kuyumcu Takip" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "KuyumcuTakip-macOS-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: KuyumcuTakip-macOS-${{ matrix.arch }}
          path: KuyumcuTakip-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kuyumcu Takip $GITHUB_REF_NAME" \
            --notes "Kurumsal uygulama ikonlu macOS sürümü. Apple Silicon ve Intel için ayrı paketler içerir."
