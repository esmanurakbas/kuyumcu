<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AKBAŞ | Kuyumcu Takip</title>
  <link rel="icon" type="image/png" href="/static/logo.png" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #121a22; color: #e6d2a5; font-family: "Segoe UI", Arial, sans-serif; }
    main { width: min(100%, 400px); text-align: center; animation: reveal .65s ease-out both; }
    .logo { display: block; width: 112px; height: 112px; object-fit: contain; margin: 0 auto 26px; }
    h1 { margin: 0; font-size: 42px; font-weight: 500; letter-spacing: .2em; padding-left: .2em; }
    .subtitle { margin: 12px 0 40px; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: #b1b6b9; }
    .track { height: 2px; max-width: 180px; margin: 0 auto 20px; background: #ffffff12; overflow: hidden; }
    .track::after { content: ""; display: block; height: 100%; background: #c9a663; transform-origin: left; animation: progress 1.6s ease-out both; }
    #status { min-height: 24px; font-size: 12px; color: #b1b6b9; }
    button { margin-top: 14px; padding: 11px 24px; background: #c9a663; color: #121a22; border: 0; border-radius: 5px; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
    [hidden] { display: none; }
    @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { main, .track::after { animation: none; } }
  </style>
</head>
<body>
  <main aria-label="AKBAŞ Kuyumcu Takip">
    <img class="logo" src="/static/logo.png" alt="AKBAŞ Logo" width="112" height="112" />
    <h1>AKBAŞ</h1>
    <p class="subtitle">Kuyumcu Takip Sistemi</p>
    <div class="track" aria-hidden="true"></div>
    <p id="status" role="status" aria-live="polite">Uygulama hazırlanıyor...</p>
    <button id="retry" type="button" hidden>Tekrar dene</button>
    <noscript>Uygulamayı açmak için JavaScript etkin olmalıdır.</noscript>
  </main>
  <script>
    const status = document.querySelector('#status');
    const retry = document.querySelector('#retry');
    async function enter() {
      retry.hidden = true;
      status.textContent = 'Uygulama haz\u0131rlan\u0131yor...';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);
      try {
        const [response] = await Promise.all([
          fetch('/api/login', { method: 'POST', signal: controller.signal }),
          new Promise(resolve => setTimeout(resolve, 1600)),
        ]);
        if (!response.ok) throw new Error('Session failed');
        const result = await response.json();
        if (!result.data?.authenticated) throw new Error('Session failed');
        window.location.replace('/');
      } catch (error) {
        status.textContent = 'Uygulama a\u00e7\u0131lamad\u0131. L\u00fctfen tekrar deneyin.';
        retry.hidden = false;
      } finally { clearTimeout(timeout); }
    }
    retry.addEventListener('click', enter);
    enter();
  </script>
</body>
</html>
