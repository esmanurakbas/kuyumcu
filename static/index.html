<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AKBAŞ</title>
    <link rel="icon" type="image/png" href="/static/logo.png" />
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <button class="brand-mark" id="themeToggle" type="button" aria-pressed="false" aria-label="Koyu temaya ge&#231;">
          <img src="/static/logo.png" alt="AKBAŞ Logo" class="brand-logo" />
        </button>
        <div class="brand-copy">
          <strong>AKBAŞ</strong>
          <small>Kuyumcu Takip</small>
        </div>
      </div>
      <nav>
        <button class="nav active" data-view="dashboard">Dashboard</button>
        <button class="nav" data-view="alis">Alış</button>
        <button class="nav" data-view="satis">Satış</button>
        <button class="nav" data-view="hurda_alis">Hurda Alış</button>
        <button class="nav" data-view="hurda_satis">Hurda Satış</button>
        <button class="nav" data-view="giderler">Giderler</button>
        <button class="nav" data-view="stok">Stok</button>
        <button class="nav" data-view="cari">Cari</button>
      </nav>
    </aside>

    <main class="app">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Güncel genel durum</p>
        </div>
        <div class="topbar-controls">
          <details class="toolbar-menu" id="dataMenu">
            <summary aria-label="Yedekleme ve veri işlemleri" title="Yedekleme ve veri işlemleri">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
            </summary>
            <div class="toolbar-menu-panel">
              <button id="backupBtn" class="top-export-button" type="button" title="Veritabanının güvenli bir kopyasını oluşturur.">YEDEK AL</button>
              <button id="restoreBtn" class="top-export-button" type="button" title="En son sağlam veritabanı yedeğini geri yükler.">SON YEDEĞİ GERİ YÜKLE</button>
              <button id="exportBtn" class="top-export-button" type="button" title="Yedek almak için tüm verileri JSON olarak indirir.">TÜM VERİLERİ DIŞA AKTAR</button>
            </div>
          </details>
          <input id="search" type="search" placeholder="Ara..." autocomplete="off" />
        </div>
      </header>

      <section id="content"></section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
